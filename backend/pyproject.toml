[project]
name = "arkaforge-backend"
version = "0.1.0"
description = "ArkaForge digital-twin backend: physics simulation core + agent layer"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "structlog>=24.1",
]

[project.optional-dependencies]
sim = [
    "scipy>=1.11",
    "pandapower>=2.14",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
]
agent = [
    "anthropic>=0.39",
    "openai>=1.40",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sim", "agent", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
